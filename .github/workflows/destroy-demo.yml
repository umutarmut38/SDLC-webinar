name: Destroy deployed demo assets
run-name: Purge deployed assets from the protected demo

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type destroy-demo-assets to authorize artifact deletion
        required: true
        type: string
      expected_bucket:
        description: Re-enter the dedicated demo bucket name
        required: true
        type: string
      expected_distribution:
        description: Re-enter the CloudFront distribution ID, or none when unused
        required: true
        type: string

concurrency:
  group: destroy-deployed-demo-assets
  cancel-in-progress: false

permissions:
  contents: none
  id-token: write

jobs:
  destroy:
    name: Purge deployed application assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo
    env:
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
      DEMO_S3_BUCKET: ${{ vars.DEMO_S3_BUCKET || secrets.DEMO_S3_BUCKET }}
      DEMO_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.DEMO_CLOUDFRONT_DISTRIBUTION_ID || secrets.DEMO_CLOUDFRONT_DISTRIBUTION_ID }}
      DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL || secrets.DEMO_BASE_URL }}

    steps:
      - name: Verify explicit cleanup scope
        id: scope
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_BUCKET: ${{ inputs.expected_bucket }}
          EXPECTED_DISTRIBUTION: ${{ inputs.expected_distribution }}
        run: |
          set -euo pipefail

          [[ "$CONFIRMATION" == 'destroy-demo-assets' ]] || {
            echo '::error::The confirmation phrase must be exactly destroy-demo-assets.'
            exit 1
          }

          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo '::error::Demo cleanup can run only from the main branch.'
            exit 1
          }

          [[ -n "$AWS_ROLE_TO_ASSUME" && -n "$AWS_REGION" && -n "$DEMO_S3_BUCKET" && -n "$DEMO_BASE_URL" ]] || {
            echo '::error::AWS_ROLE_TO_ASSUME, AWS_REGION, DEMO_S3_BUCKET, and DEMO_BASE_URL must be configured.'
            exit 1
          }

          [[ "$DEMO_S3_BUCKET" == *demo* ]] || {
            echo '::error::The configured bucket name must contain demo.'
            exit 1
          }

          [[ "$EXPECTED_BUCKET" == "$DEMO_S3_BUCKET" ]] || {
            echo '::error::The re-entered bucket does not match the configured demo bucket.'
            exit 1
          }

          configured_distribution="${DEMO_CLOUDFRONT_DISTRIBUTION_ID:-none}"
          [[ "$EXPECTED_DISTRIBUTION" == "$configured_distribution" ]] || {
            echo '::error::The re-entered distribution does not match the configured demo distribution.'
            exit 1
          }

          if [[ "$configured_distribution" == 'none' ]]; then
            echo 'DEMO_CLOUDFRONT_DISTRIBUTION_ID=' >> "$GITHUB_ENV"
            echo 'has_distribution=false' >> "$GITHUB_OUTPUT"
          else
            echo 'has_distribution=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: codex-demo-assets-cleanup

      - name: Delete deployed application assets
        shell: bash
        run: |
          set -euo pipefail
          aws s3 rm "s3://$DEMO_S3_BUCKET" --recursive --only-show-errors

      - name: Verify no current keys remain
        shell: bash
        run: |
          set -euo pipefail
          object_count="$(aws s3api list-objects-v2 \
            --bucket "$DEMO_S3_BUCKET" \
            --query 'KeyCount' \
            --output text)"

          [[ "$object_count" == '0' ]] || {
            echo '::error::Current keys remain in the configured demo bucket.'
            exit 1
          }

      - name: Invalidate CloudFront and wait
        if: steps.scope.outputs.has_distribution == 'true'
        shell: bash
        run: |
          set -euo pipefail
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$DEMO_CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DEMO_CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$invalidation_id"

      - name: Verify deployed app is no longer served
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location \
            --output /dev/null \
            --write-out '%{http_code}' \
            --max-time 30 \
            "$DEMO_BASE_URL")"

          if [[ "$status" =~ ^2 ]]; then
            echo "::error::The demo URL still returns HTTP $status after asset cleanup."
            exit 1
          fi

          echo "The demo URL now returns HTTP $status."

      - name: Write cleanup summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Deployed demo asset cleanup'
            echo
            echo "- Workflow result: **${{ job.status }}**"
            echo '- Target: protected `demo` environment'
            echo '- Deleted: all currently visible keys in the dedicated demo bucket'
            echo '- Retained: S3 bucket, CloudFront distribution, IAM roles, OIDC provider, GitHub environments, and variables'
          } >> "$GITHUB_STEP_SUMMARY"
