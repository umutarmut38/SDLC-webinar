# Sanitized demo template. Never add literal credentials to this file.

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

[mcp_servers.aws_mcp]
command = "uvx"
args = [
  "mcp-proxy-for-aws==1.6.2",
  "https://aws-mcp.eu-central-1.api.aws/mcp",
  "--profile", "NTT",
  "--region", "eu-central-1",
  "--metadata", "AWS_REGION=eu-central-1",
  "--read-only",
]
startup_timeout_sec = 60

# Run `graphify install --project --platform codex`, generate a graph intentionally,
# then enable this entry only after graphify-out/graph.json exists.
[mcp_servers.graphify]
command = "graphify-mcp"
args = ["graphify-out/graph.json"]
enabled = false
